(function(){

/* version 1.8: one data collection, three views of it (Week, Month, 3 months). Every number, node size, text and finding

 VOL={mail_in:sum(D.vol.mail_in),mail_out:sum(D.vol.mail_out),meet:sum(D.vol.meet),chat:(D.chats||0)};

};

/* ===== maths ===== */
function V(x,y,z){return {x:x,y:y,z:z};}

function norm(a){var l=len(a)||1;return mul(a,1/l);}
function lerp(a,b,t){return V(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t);}

var seed=11; function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function gauss(){return (rnd()+rnd()+rnd()-1.5)/1.5;}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function hex2rgb(h){h=String(h||'#ffffff').replace('#',''); if(h.length===3) h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2); var c=[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; return c.map(function(x){return isFinite(x)?x:255;});}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function dirAE(az,el){var a=az*Math.PI/180,e=el*Math.PI/180; return V(Math.cos(e)*Math.sin(a),Math.sin(e),-Math.cos(e)*Math.cos(a));}

/* ===== the Work IQ sphere ===== */
var RS=235;
Object.keys(CLASSES).forEach(function(k){var c=CLASSES[k]; c.rgb=hex2rgb(c.color); c.dir=dirAE(c.ae[0],c.ae[1]);

 var up=Math.abs(c.dir.y)>0.95?V(1,0,0):V(0,1,0), e1=norm(cross(c.dir,up)), e2=norm(cross(c.dir,e1)), sp=k==='customer'?0.135:0.155;
 m.forEach(function(n,i){var ang=sp*Math.sqrt(i+0.4), az=i*2.39996, off=add(mul(e1,Math.cos(az)*Math.sin(ang)),mul(e2,Math.sin(az)*Math.sin(ang))); n.dir=norm(add(mul(c.dir,Math.cos(ang)),off)); n.p=mul(n.dir,RS);});

byId.me.p=V(0,0,0); byId.me.dir=V(0,0,-1);
/* the focus sits next to me, inside the sphere, and is labelled as the focus */
var FN=(CFG.focus&&byId[CFG.focus.id]&&byId[CFG.focus.id].cls!=='hub')?byId[CFG.focus.id]:null;
if(FN){ FN.isFocus=true; FN.size=Math.max(FN.size,11); FN.dir=norm(V(0.72,0.3,-0.62)); FN.p=mul(FN.dir,RS*0.34); }
nodes.forEach(function(n){n.size0=n.size;});
var FTOT=0, FVOL=null;
function focusVol(){FTOT=0; FVOL=null; if(FN&&FD&&FD.vol){ FVOL={emails:sum(FD.vol.mail_in)+sum(FD.vol.mail_out),meet:sum(FD.vol.meet),chats:sum(FD.vol.chats),files:FILES?sum(FD.vol.files):0}; FTOT=FVOL.emails+FVOL.meet+FVOL.chats+FVOL.files; }}
focusVol();
/* version 1.8: in each view a node is shown or not, sized by its share of that view, and carries its evidence there:
   e = [emails, calendar events, chats, files, mentions, keyword matches], t = its signals, x = % of the view, b = [busiest column, count] */
function viewNodes(){var r=VR();
 nodes.forEach(function(n){var x=r?r.ent[n.id]:null;
  n.vis=n.cls==='hub'||!r||!!(x&&x.v);
  n.ev=(x&&x.e)||null; n.fl=(x&&isNum(x.fl))?x.fl:null; n.t=(x&&isNum(x.t))?x.t:null; n.x=(x&&isNum(x.x))?x.x:null; n.b=(x&&x.b)||null;

  var s=(r&&x&&isNum(x.s))?x.s:n.size0; if(n.isFocus) s=Math.max(s,11); if(n.cls==='hub') s=14; n.sizeT=s;});}
viewNodes(); nodes.forEach(function(n){n.size=n.sizeT; n.va=n.vis?1:0;});

 if(n.sig&&GRID[n.sig]){var a=GRID[n.sig], b=null; a.forEach(function(v,i){v=+v||0; if(v>0&&(!b||v>b[1])) b=[i,v];}); var t=sum(a); return {e:null,t:t,x:TOTAL?100*t/TOTAL:0,b:b,kw:true};}
 return {e:null,t:null,x:null,b:null,kw:false};}

function tipShare(n){var st=stats(n); if(n.cls==='hub'||!st.t) return ''; return '<div class="sub">'+fmtN(st.t)+' signals'+(isNum(st.x)?', '+pctTxt(st.x)+' of my work':'')+' in '+esc(PERIOD)+'</div>';}
function fname(){return FN?esc(nm(FN.id)):'';}
function fmatch(){return CFG.focus&&CFG.focus.type==='customer'?'name, mail domain and keywords':'name and keywords';}

/* ===== particles: one stream per source, 1 dot = DOT signals ===== */
var SRC=[];
function makeSources(){SRC=[{k:'mail_in',name:'Emails received',color:'#3b82f6',n:VOL.mail_in},{k:'mail_out',name:'Emails I sent',color:'#22d3ee',n:VOL.mail_out},{k:'meet',name:'Calendar events',color:'#2dd4bf',n:VOL.meet},{k:'chat',name:(TXT.chatLabel||'Teams chats (group and 1:1)'),color:'#a78bfa',n:VOL.chat}];

var SRC8, SRCROW=[0,0,1,3,4];
function makeSrc8(){var ppl=isNum(D.senders)?D.senders:null, act=VOL.mail_out+(FILES?VOL.files:0), NOT='not in my sphere yet', VIA='via connectors, not in my sphere yet';
