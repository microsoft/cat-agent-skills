  document.documentElement.setAttribute("data-theme", t);

<style>
/* sharepoint-site-kit section styles (v2 design language)
   Look and feel: a light "wash" hero or a deep "band" hero, each with a generic background
   motif (soft orbs, concentric arcs, dot grid, or an uploaded image) and a glass badge;
   an executive summary card that overlaps the hero; pill eyebrows with a gradient chip;
   color-rotating cards; a pure CSS light/dark switch; gentle motion.
   Colors and fonts come ONLY from the tokens between brand:start and brand:end, which
   scripts/extract_brand.py writes from the PowerPoint template (or brand kit).
   Static pages: one style element, no scripts. Live pages: the theme bootstrap sets
   data-theme on <html>; the same tokens apply. */

/* brand:start */
:root{color-scheme:light;
  --ground:#F7F8FA;--ground2:#EEF1F5;--card:#FFFFFF;
  --ink:#16181D;--body:#3A3F47;--muted:#5F6670;--line:rgba(22,24,29,.10);
  --accent:#2563EB;--accent-ink:#1D4ED8;--accent2:#0D9488;--accent3:#7C3AED;
  --c1:#2563EB;--c2:#0D9488;--c3:#7C3AED;--c4:#D97706;--c5:#DB2777;--c6:#475569;
  --pale:#E0EAFD;--navy:#101A2E;--band-ink:#D6DEEA;--band-muted:#A9B6C8;--on-accent:#FFFFFF;
  --grad:linear-gradient(90deg,#2563EB,#0D9488 60%,#7C3AED);
  --wash:linear-gradient(180deg,#C9DAFB 0%,#E6EEFD 38%,rgba(247,248,250,0) 100%);
  --shadow:0 1px 2px rgba(16,26,46,.04),0 8px 24px rgba(16,26,46,.08);
  --fd:"Segoe Sans Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --ft:"Segoe Sans Text","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not(:has(#mode:checked)){color-scheme:dark;
  --ground:#111418;--ground2:#191D23;--card:#1A1F26;--ink:#F1F3F6;--body:#D3D8DF;--muted:#A3ABB6;--line:rgba(255,255,255,.10);
  --accent:#60A5FA;--accent-ink:#93C5FD;--c1:#60A5FA;--c2:#2DD4BF;--c3:#A78BFA;--c4:#FBBF24;--c5:#F472B6;--c6:#94A3B8;
  --pale:#16294A;--navy:#0B1220;--wash:linear-gradient(180deg,#0F2347 0%,#111B2C 40%,rgba(17,20,24,0) 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]):has(#mode:checked){color-scheme:dark;
  --ground:#111418;--ground2:#191D23;--card:#1A1F26;--ink:#F1F3F6;--body:#D3D8DF;--muted:#A3ABB6;--line:rgba(255,255,255,.10);
  --accent:#60A5FA;--accent-ink:#93C5FD;--c1:#60A5FA;--c2:#2DD4BF;--c3:#A78BFA;--c4:#FBBF24;--c5:#F472B6;--c6:#94A3B8;
  --pale:#16294A;--navy:#0B1220;--wash:linear-gradient(180deg,#0F2347 0%,#111B2C 40%,rgba(17,20,24,0) 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#111418;--ground2:#191D23;--card:#1A1F26;--ink:#F1F3F6;--body:#D3D8DF;--muted:#A3ABB6;--line:rgba(255,255,255,.10);
  --accent:#60A5FA;--accent-ink:#93C5FD;--c1:#60A5FA;--c2:#2DD4BF;--c3:#A78BFA;--c4:#FBBF24;--c5:#F472B6;--c6:#94A3B8;
  --pale:#16294A;--navy:#0B1220;--wash:linear-gradient(180deg,#0F2347 0%,#111B2C 40%,rgba(17,20,24,0) 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}
/* brand:end */

/* base */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--ft);background:var(--ground);color:var(--body);line-height:1.55;font-size:16px;transition:background .3s,color .3s}
a{color:var(--accent-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
img{max-width:100%;height:auto}
.wrap{max-inline-size:1200px;margin-inline:auto;padding-inline:36px}
h1,h2,h3,h4{font-family:var(--fd);color:var(--ink)}
h2{font-weight:400;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.1;margin:10px 0 0}
h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.visually-hidden{position:absolute!important;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* color rotation: put .rot on any grid; children get --cc from the six theme accents */
.rot>:nth-child(6n+1){--cc:var(--c1)}.rot>:nth-child(6n+2){--cc:var(--c2)}.rot>:nth-child(6n+3){--cc:var(--c3)}
.rot>:nth-child(6n+4){--cc:var(--c4)}.rot>:nth-child(6n+5){--cc:var(--c5)}.rot>:nth-child(6n){--cc:var(--c6)}

/* eyebrow label (section) */
.kick{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.kick i{display:inline-block;inline-size:22px;block-size:4px;border-radius:999px;background:var(--grad)}

/* light/dark switch (pure CSS: a checkbox at the top of body flips the tokens) */
#mode{position:absolute;opacity:0;pointer-events:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink)}
.brand i{inline-size:22px;block-size:22px;border-radius:50%;background:var(--grad)}
.brand img{inline-size:24px;block-size:24px;border-radius:6px}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--muted);user-select:none}
.toggle .track{position:relative;inline-size:48px;block-size:26px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.toggle .track::after{content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;inline-size:18px;block-size:18px;border-radius:50%;background:var(--grad);transition:transform .25s}
.toggle .l-dark{display:none}
:root:has(#mode:checked) .toggle .track::after{transform:translateX(22px)}
:root:has(#mode:checked) .toggle .l-light{display:none}:root:has(#mode:checked) .toggle .l-dark{display:inline}
@media (prefers-color-scheme:dark){.toggle .track::after{transform:translateX(22px)}.toggle .l-light{display:none}.toggle .l-dark{display:inline}
  :root:has(#mode:checked) .toggle .track::after{transform:none}:root:has(#mode:checked) .toggle .l-light{display:inline}:root:has(#mode:checked) .toggle .l-dark{display:none}}
#mode:focus-visible~header .toggle .track{outline:3px solid var(--accent);outline-offset:2px}
.hero.deep .brand,.hero.deep .toggle{color:var(--band-ink)}

/* 1. hero, shared parts */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero .wrap{position:relative;z-index:1}
/* background motif: <span class="motif"><i></i><i></i><i></i></span> as the first child of the hero.
   Pick one with a class on the hero: motif-orbs (default), motif-arcs, motif-grid or motif-image.
   Generic on purpose: never draw shapes that echo a product logo. */
.motif{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.motif i{position:absolute;display:block}
/* orbs: soft blurred light in the theme colors */
.motif-orbs .motif i{border-radius:50%;filter:blur(56px);opacity:.7}
.motif-orbs .motif i:nth-child(1){inline-size:480px;block-size:480px;inset-block-start:-140px;inset-inline-end:6%;background:var(--c1)}
.motif-orbs .motif i:nth-child(2){inline-size:400px;block-size:400px;inset-block-end:-170px;inset-inline-end:-80px;background:var(--c2)}
.motif-orbs .motif i:nth-child(3){inline-size:260px;block-size:260px;inset-block-start:38%;inset-inline-end:30%;background:var(--c3);opacity:.4}
/* arcs: thin concentric rings fading out from one corner */
.motif-arcs .motif i:nth-child(1){inline-size:900px;block-size:900px;inset-block-start:-360px;inset-inline-end:-300px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 34px,color-mix(in srgb,var(--c1) 50%,transparent) 34px 36px);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 68%);mask-image:radial-gradient(circle,#000 30%,transparent 68%)}
.motif-arcs .motif i:nth-child(2){inline-size:340px;block-size:340px;inset-block-end:-160px;inset-inline-end:18%;border-radius:50%;filter:blur(60px);background:var(--c2);opacity:.45}
.motif-arcs .motif i:nth-child(3){display:none}
/* grid: a dot grid fading in toward the right, plus one soft glow */
.motif-grid .motif i:nth-child(1){inset:0;background-image:radial-gradient(color-mix(in srgb,var(--c1) 60%,transparent) 1.6px,transparent 1.8px);background-size:22px 22px;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 80%);mask-image:linear-gradient(100deg,transparent 30%,#000 80%)}
.motif-grid .motif i:nth-child(2){inline-size:420px;block-size:420px;inset-block-start:-120px;inset-inline-end:-60px;border-radius:50%;filter:blur(64px);background:var(--c2);opacity:.45}
.motif-grid .motif i:nth-child(3){display:none}
/* image: an uploaded or approved photo set on the hero as style="--hero-img:url(...)",
   faded away from the text side so the headline always stays readable */
.motif-image .motif i:nth-child(1){inset:0;background:var(--hero-img) center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 25%,#000 70%);mask-image:linear-gradient(90deg,transparent 25%,#000 70%)}
.motif-image .motif i:nth-child(2),.motif-image .motif i:nth-child(3){display:none}
.hero.deep.motif-image .motif i:nth-child(1){-webkit-mask-image:none;mask-image:none;opacity:.55}
.hero.deep.motif-image .motif i:nth-child(2){display:block;inset:0;background:linear-gradient(90deg,var(--navy) 0 40%,color-mix(in srgb,var(--navy) 45%,transparent))}
.badge{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 16px 7px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.badge i{inline-size:10px;block-size:10px;border-radius:50%;background:var(--grad)}
.badge img{inline-size:22px;block-size:22px;border-radius:6px}
.hero h1{font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1.04;letter-spacing:-.025em;margin:20px 0 18px;max-inline-size:680px}
.hero .lead{font-size:19px;max-inline-size:600px;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:600;text-decoration:none;font-size:15px;transition:transform .2s,box-shadow .2s}
.btn svg{inline-size:16px;block-size:16px;transition:transform .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.btn:hover svg,a:hover .open svg{transform:translateX(4px)}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:40px 0 0;padding:0;list-style:none}
.stats li{border-inline-start:3px solid var(--cc,var(--accent));padding-inline-start:12px}
.stats b{display:block;font-family:var(--fd);font-size:30px;font-weight:600;line-height:1}
.stats span{font-size:13px}

/* 1a. hero.wash (light gradient wash, background motif, glass cards) */
.hero.wash{background:var(--wash);padding-block-end:88px;color:var(--body)}
.hero.wash .badge{color:var(--ink);background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line)}
.hero.wash h1{color:var(--ink)}
.hero.wash h1 span{font-style:italic}
.hero.wash .lead{color:var(--body)}
.hero.wash .btn.pri{background:var(--ink);color:var(--ground);box-shadow:var(--shadow)}
.hero.wash .btn.sec{color:var(--ink);background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line)}
.hero.wash .stats b{color:var(--ink)}.hero.wash .stats span{color:var(--muted)}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:start;margin-block-start:28px}
.hero-grid>div:first-child h1{margin-top:0}
.aud{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-block-start:26px;max-inline-size:620px}
.aud div{border-inline-start:3px solid var(--cc,var(--c1));padding-inline-start:12px}
.aud b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.aud span{font-size:15px;color:var(--ink)}
.problem{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.plbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.pcard{display:flex;gap:14px;align-items:flex-start;border-radius:22px;padding:18px 20px;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.pcard .pi{flex:none;inline-size:40px;block-size:40px;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:19px;color:var(--ink);background:color-mix(in srgb,var(--cc) 32%,var(--card))}
.pcard strong{display:block;font-size:17px;font-weight:600;color:var(--ink)}
.pcard p{margin:4px 0 0;font-size:15px;color:var(--muted)}

/* 1b. hero.deep (dark brand band, radial glows, background motif, glass badge) */
.hero.deep{color:var(--band-ink);padding-block-end:72px;background:radial-gradient(900px 520px at 92% -10%,color-mix(in srgb,var(--accent) 40%,transparent),transparent 60%),radial-gradient(700px 480px at 75% 120%,color-mix(in srgb,var(--accent2) 45%,transparent),transparent 60%),var(--navy)}
.hero.deep.motif-orbs .motif i{opacity:.5}
.hero.deep.motif-grid .motif i:nth-child(1){background-image:radial-gradient(rgba(255,255,255,.28) 1.6px,transparent 1.8px)}
.hero.deep.motif-arcs .motif i:nth-child(1){background:repeating-radial-gradient(circle,transparent 0 34px,rgba(255,255,255,.22) 34px 36px)}
.hero.deep .badge{color:var(--band-ink);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22)}
.hero.deep h1{color:#fff;font-weight:700}
.hero.deep h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero.deep .lead{color:var(--band-ink)}
.hero.deep .btn.pri{background:#fff;color:var(--navy)}
.hero.deep .btn.sec{border:1px solid rgba(255,255,255,.4);color:#fff}
.hero.deep .stats b{color:#fff}.hero.deep .stats span{color:var(--band-muted)}

/* section navigation (sticky pill bar under the hero) */
.navbar{position:sticky;inset-block-start:0;z-index:5;background:color-mix(in srgb,var(--ground) 82%,transparent);backdrop-filter:blur(14px);border-block-end:1px solid var(--line)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.nav a{flex:none;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;transition:background .2s}
.nav a:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* 2. executive summary (overlaps the hero edge) */
.summary{position:relative;z-index:2;margin-block-start:-48px;background:var(--card);border-radius:28px;padding:30px 36px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.summary .tag{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);writing-mode:vertical-rl;transform:rotate(180deg)}
.summary p{margin:0 0 10px;font-size:17px;color:var(--ink)}.summary p:last-child{margin:0;font-size:16px;color:var(--muted)}

/* section header */
section{padding-block:72px 0;scroll-margin-top:64px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sh p{margin:0;max-inline-size:460px;color:var(--muted);font-size:17px}

/* 3. at a glance / purpose / phases */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.glance article{position:relative;background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.glance article::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;block-size:5px;background:var(--grad)}
.glance p{margin:8px 0 0}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:4px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--cc,var(--accent)) 18%,var(--card));color:var(--ink)}

/* 4. program documents */
.docs{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:20px}
.doc{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--body);background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.doc.feat{background:linear-gradient(150deg,var(--pale),var(--card) 70%);border-color:transparent}
.doc .ty{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.doc p{margin:0;color:var(--muted)}
.open{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent-ink);font-size:14px;margin-top:auto}
.open svg{inline-size:16px;block-size:16px;transition:transform .2s}
.doc:hover,.ws:hover,.sub:hover,.ticket:hover,.oc:hover,.lane:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.14)}

/* 5. workstream cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ws{--cc:var(--accent);position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--body);background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s,box-shadow .2s;overflow:hidden}
.ws::after{content:"";position:absolute;inset-inline-end:-50px;inset-block-start:-50px;inline-size:150px;block-size:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--cc) 30%,transparent),transparent 70%);transition:transform .3s}
.ws:hover::after{transform:scale(1.3)}
.num{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--accent-ink)}
@supports (-webkit-background-clip:text) or (background-clip:text){.num{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}}
.ws p{margin:0;color:var(--muted);flex:1}
.wsf{display:flex;justify-content:space-between;align-items:center;gap:10px;border-block-start:1px solid var(--line);padding-block-start:14px;margin-top:6px}
.ld{font-size:14px;color:var(--ink);font-weight:600}
.ld em{display:block;font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ld.tbc{color:var(--muted);font-style:italic;font-weight:500}
.wsf .open{margin-top:0}

/* 5b. outcomes grid (numbered, color-coded) */
.ogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);border-block-start:5px solid var(--cc,var(--accent));transition:transform .2s,box-shadow .2s}
.oc .on{display:inline-grid;place-items:center;inline-size:38px;block-size:38px;border-radius:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--cc,var(--accent)) 30%,var(--card));margin-bottom:12px}
.oc p{margin:6px 0 0;color:var(--muted);font-size:15px}

/* 5c. before / after shift */
.shift{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch;margin-block-end:22px}
.shift>div{border-radius:22px;padding:22px 24px;border:1px solid var(--line);background:var(--card)}
.shift .to{background:linear-gradient(140deg,color-mix(in srgb,var(--c1) 16%,var(--card)),color-mix(in srgb,var(--c2) 14%,var(--card)))}
.shift b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shift .to b{color:var(--accent-ink)}
.shift ul{margin:10px 0 0;padding-inline-start:18px}.shift li{margin-bottom:6px}
.shift .arrow{align-self:center;font-size:28px;color:var(--muted)}

/* 6. dark band for shared or supporting streams */
.band{margin-top:72px;background:radial-gradient(600px 300px at 0% 0%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 60%),radial-gradient(600px 320px at 100% 100%,color-mix(in srgb,var(--accent2) 32%,transparent),transparent 60%),var(--navy);color:var(--band-ink);padding-block:64px}
.band section{padding:0}
.band h2,.band h3{color:#fff}
.band .sh p,.band .kick{color:var(--band-muted)}
.sub{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--band-ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px;transition:transform .2s,background .2s}
.sub:hover{background:rgba(255,255,255,.11)}
.sub p{margin:0;flex:1}
.sub .open{color:#fff}
.verb{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:#fff;color:var(--navy)}

/* 7. role lanes */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.lane{--lc:var(--cc,var(--accent));background:var(--card);border-radius:20px;padding:18px;border:1px solid var(--line);border-block-start:5px solid var(--lc);transition:transform .25s,box-shadow .25s}
.lane-n{display:inline-grid;place-items:center;inline-size:34px;block-size:34px;border-radius:11px;background:color-mix(in srgb,var(--lc) 32%,var(--card));color:var(--ink);font-weight:600;margin-bottom:10px}
.lane h3{font-size:17px}
.lane ul{margin:10px 0 0;padding-inline-start:18px;color:var(--muted);font-size:15px}

/* 8. timeline / run of show */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.slot{--cc:var(--accent);display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:start;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--cc);border-radius:18px;padding:18px 22px}
.slot time{font-family:var(--fd);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.slot p{margin:4px 0 0;color:var(--muted)}
.slot .dur{font-size:13px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--cc) 20%,var(--card));border-radius:999px;padding:3px 10px;white-space:nowrap}

/* 8b. journey (milestones with done / now states) */
.journey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));position:relative}
.journey li{position:relative;padding:44px 14px 0;text-align:center}
.journey li::before{content:"";position:absolute;inset-block-start:16px;inset-inline:0;block-size:4px;background:var(--line)}
.journey li.done::before,.journey li.now::before{background:linear-gradient(90deg,var(--c1),var(--c2))}
.journey li::after{content:"";position:absolute;inset-block-start:6px;inset-inline-start:calc(50% - 12px);inline-size:24px;block-size:24px;border-radius:50%;background:var(--card);border:4px solid var(--line)}
.journey li.done::after{background:var(--c2);border-color:var(--c2)}
.journey li.now::after{border-color:var(--c1);box-shadow:0 0 0 6px color-mix(in srgb,var(--c1) 25%,transparent)}
.journey strong{display:block;font-size:16px;color:var(--ink)}
.journey span{display:block;color:var(--muted);font-size:14px}
.journey em{display:inline-block;margin-block-start:6px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}

/* 9. rhythm (meeting cadence) */
.rhythm{display:grid;grid-template-columns:repeat(3,1fr);position:relative;list-style:none;margin:0;padding:0}
.rhythm::before{content:"";position:absolute;inset-block-start:11px;inset-inline:12px;block-size:3px;background:var(--grad);border-radius:999px;opacity:.6}
.step{position:relative;padding:36px 24px 0 0}
.step::before{content:"";position:absolute;inset-block-start:2px;inset-inline-start:0;inline-size:22px;block-size:22px;border-radius:50%;background:var(--ground);border:5px solid var(--cc,var(--accent));box-shadow:0 0 0 4px var(--ground)}
.step b{display:block;font-family:var(--fd);color:var(--ink);font-size:18px}
.step span{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin:4px 0}
.step p{margin:0;color:var(--muted)}

/* 10. principles */
.princ{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;margin:0;padding:0;counter-reset:pr}
.princ li{counter-increment:pr;background:var(--ground2);border-radius:18px;padding:20px 22px}
.princ li::before{content:counter(pr,decimal-leading-zero);display:block;font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--accent-ink);margin-bottom:6px}
.princ b{display:block;color:var(--ink);font-family:var(--fd);font-size:17px}
.princ span{display:block;margin-top:4px;font-size:15px;color:var(--muted)}

/* 10b. kit / resource tickets */
.kit{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ticket{--cc:var(--accent);position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.ticket::before{content:"";position:absolute;inset-block-start:-70px;inset-inline-end:-60px;inline-size:200px;block-size:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--cc) 40%,transparent),transparent 70%)}
.ticket .ft{display:inline-grid;place-items:center;inline-size:56px;block-size:56px;border-radius:17px;background:color-mix(in srgb,var(--cc) 32%,var(--card));color:var(--ink);font-weight:600;font-size:14px}
.ticket h3{font-size:22px;font-weight:400}
.ticket p{margin:0;color:var(--muted)}
.ticket .go{margin-block-start:auto;padding-block-start:10px;display:flex;flex-wrap:wrap;gap:10px}
.ticket .go a{text-decoration:none;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--ground)}
.ticket .go a.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* 11. team */
.people{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.people li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.avatar{flex:none;display:grid;place-items:center;inline-size:38px;block-size:38px;border-radius:50%;background:color-mix(in srgb,var(--cc,var(--accent)) 35%,var(--card));color:var(--ink);font-weight:600;font-size:13px}
.people b{display:block;color:var(--ink);font-size:15px}
.people span{font-size:13px;color:var(--muted)}

/* note callout (facilitator or reader note) */
.fnote{margin-block-start:22px;border-radius:16px;padding:14px 18px;background:color-mix(in srgb,var(--c4) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c4) 45%,var(--card));font-size:15px;color:var(--ink)}

/* 12. feedback / call to action band */
.ask{margin-block-start:84px;border-radius:32px;padding:42px 44px;position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 26%,var(--card)),color-mix(in srgb,var(--c1) 12%,var(--card)) 55%,color-mix(in srgb,var(--c2) 22%,var(--card)));border:1px solid var(--line)}
.ask::after{content:"";position:absolute;z-index:-1;inset-inline-end:-80px;inset-block-end:-140px;inline-size:340px;block-size:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c3) 40%,transparent),transparent 70%)}
.ask h2{margin:8px 0 0}
.ask p{margin:10px 0 0;max-inline-size:560px;color:var(--ink)}
.ask .btn{justify-self:end;background:var(--ink);color:var(--ground)}

/* 13. footer */
.foot{margin-top:72px;padding-block:24px 36px;border-block-start:1px solid var(--line);color:var(--muted);font-size:14px}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot i{display:inline-block;inline-size:28px;block-size:4px;border-radius:999px;background:var(--grad);vertical-align:middle;margin-inline-end:10px}

/* motion: staggered entry, drifting shapes; all off for reduced motion */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drift{from{translate:0 0}to{translate:-18px 14px}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 80ms)}
.motif-orbs .motif i:nth-child(1),.motif-arcs .motif i:nth-child(2),.motif-grid .motif i:nth-child(2){animation:drift 16s ease-in-out infinite alternate}
.motif-orbs .motif i:nth-child(2){animation:drift 20s ease-in-out infinite alternate-reverse}

/* responsive */
@media (max-width:980px){.grid,.docs,.ogrid,.kit,.princ{grid-template-columns:repeat(2,1fr)}.hero-grid{grid-template-columns:1fr}.rhythm{grid-template-columns:1fr;gap:8px}.rhythm::before{display:none}.ask{grid-template-columns:1fr}.ask .btn{justify-self:start}}
@media (max-width:640px){
  .wrap{padding-inline:20px}
  .grid,.docs,.ogrid,.kit,.princ,.aud{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr;gap:10px;padding:22px}
  .summary .tag{writing-mode:horizontal-tb;transform:none}
  .slot{grid-template-columns:1fr;gap:6px}
  .shift{grid-template-columns:1fr}.shift .arrow{transform:rotate(90deg);justify-self:center}
  .motif{opacity:.55}
  .motif-image .motif i:nth-child(1){-webkit-mask-image:linear-gradient(180deg,#000,transparent 60%);mask-image:linear-gradient(180deg,#000,transparent 60%);opacity:.5}
  .journey{grid-template-columns:1fr}.journey li{text-align:start;padding:0 0 18px 40px}.journey li::before{inset-block:0;inset-inline-start:10px;inline-size:4px;block-size:auto}.journey li::after{inset-block-start:0;inset-inline-start:0}
  .ask{padding:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* live gallery */
.g-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.g-search{flex:1 1 280px}
.g-tools input[type=search],.g-tools select{inline-size:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.g-tools select{inline-size:auto}
.g-toggle{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.g-clear{font:inherit;font-size:14px;border:0;background:none;color:var(--accent-ink);text-decoration:underline;cursor:pointer}
.g-count,.g-note{font-size:14px;color:var(--muted);margin:0 0 12px}
.g-note{color:var(--accent-ink)}
.g-status{padding:24px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.g-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.g-card{display:flex;flex-direction:column;gap:8px;block-size:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.g-card h3 a{color:var(--ink);text-decoration:none}.g-card h3 a:hover{text-decoration:underline}
.g-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.g-meta .pill{margin:0}
.g-date{font-size:13px;color:var(--muted);margin-inline-start:auto}
.g-desc{margin:0;color:var(--body);flex:1}
.g-people,.g-nolink{margin:0;font-size:14px;color:var(--muted)}
.g-hit .g-card{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--pale);color:var(--ink);border-radius:3px}
.lh-pop{position:fixed;z-index:2147483000;inset-block-start:50%;inset-inline-start:50%;transform:translate(-50%,-50%);inline-size:min(480px,calc(100vw - 24px));background:var(--card);color:var(--body);border-radius:16px;padding:22px;box-shadow:0 20px 48px rgba(0,0,0,.32);border-block-start:6px solid var(--accent)}
.lh-pop h2{font-size:22px;margin:0 0 8px}
.lh-row{display:flex;gap:8px}.lh-row input{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink)}
.lh-pop button{font:inherit;border-radius:999px;padding:8px 14px;border:1px solid var(--line);background:var(--ground2);color:var(--ink);cursor:pointer}
</style>

<body>
<!-- sharepoint-site-kit live list template.
     How it works (inferred from a working page; no public documentation found, verify on your site):
     1. The ka-livedata-manifest block declares which SharePoint list this page reads.
     2. The SharePoint HTML viewer injects window.__LD_RESULTS__ keyed by spItemUrl, format "rows",
        content = JSON string {"headers":[...],"rows":[[...]]}.
     3. site-page-config.publicationSource must match the manifest entry exactly, or the page refuses to render.
     4. The hidden link allowlist holds static copies of every list link, because the viewer only lets
        links open when they appear statically in the page. Regenerate it with scripts/allowlist_from_list.py
        whenever list items change.
     5. If __LD_RESULTS__ is missing, the page renders the optional snapshot-data block, else an error state. -->
<header class="hero wash motif-orbs"><span class="motif" aria-hidden="true"><i></i><i></i><i></i></span>
<div class="wrap">
<div class="topbar"><span class="brand"><i aria-hidden="true"></i>{{PROGRAM_NAME}}</span><button type="button" id="theme-toggle" class="btn sec" aria-pressed="false">Dark mode</button></div>
<span class="badge rise"><i aria-hidden="true"></i>{{EYEBROW}}</span>
<h1 class="rise" style="--i:1">{{H1_MAIN}} <span>{{H1_ACCENT}}</span></h1>
<p class="lead rise" style="--i:2">{{LEAD}}</p>
</div></header>
<main>
<div class="wrap">
<div class="summary rise" style="--i:3"><span class="tag">Executive summary</span><div><p>{{SUMMARY_P1}}</p></div></div>

<section id="gallery" aria-labelledby="h-gallery" data-state="loading">
<div class="sh"><div><div class="kick"><i></i>{{GALLERY_EYEBROW}}</div><h2 id="h-gallery">{{GALLERY_H2}}</h2></div><p>{{GALLERY_INTRO}}</p></div>
<form id="gallery-tools" class="g-tools" role="search">
  <label class="g-search"><span class="visually-hidden">Search</span><input id="g-q" type="search" placeholder="Search titles, descriptions and people" autocomplete="off"></label>
  <div id="g-filters" class="g-filters"></div>
  <label id="g-scope-wrap" class="g-toggle" hidden><input id="g-scope" type="checkbox"> <span>Internal only</span></label>
  <select id="g-sort" aria-label="Sort"><option value="newest">Newest first</option><option value="title">Title A to Z</option></select>
  <button type="button" id="g-clear" class="g-clear" hidden>Clear filters</button>
</form>
<p id="g-count" class="g-count" aria-live="polite"></p>
<p id="g-note" class="g-note" hidden></p>
<p id="g-status" class="g-status" role="status">Loading items...</p>
<ul id="gallery-list" class="g-list" aria-busy="true"></ul>
</section>
</div>
</main>
<footer class="foot"><div class="wrap"><span><i aria-hidden="true"></i>{{PROGRAM_NAME}}</span><span>Data from the list "{{LIST_DISPLAY_NAME}}"</span></div></footer>

<script>
(() => {
  "use strict";
  /* ---- 1. Column mapping: edit this object only. Each entry lists candidate
     column names (internal name first, then display name). id and title are required. */
  const COLUMN_MAP = {
    id: ["ID"],
    title: ["Title", "LinkTitle"],
    description: ["{{DESCRIPTION_COLUMN}}", "Description"],
    url: ["{{URL_COLUMN}}", "Link", "URL"],
    people: ["{{PEOPLE_COLUMN}}", "Owner"],
    date: ["{{DATE_COLUMN}}", "Modified", "Created"],
    internal: [],                     /* optional yes/no column, e.g. ["InternalOnly"] */
    filters: [                        /* select filters; multi: true for multi-value columns */
      { key: "category", label: "Category", columns: ["{{FILTER_1_COLUMN}}"], multi: false },
      { key: "topic", label: "Topic", columns: ["{{FILTER_2_COLUMN}}"], multi: true },
    ],
  };
  const EXTERNAL_HOSTS = []; /* e.g. ["learn.microsoft.com", "github.com"]; used for the scope toggle when no internal column exists */
  const ITEM_NOUN = ["item", "items"];

  const $ = id => document.getElementById(id);
  const section = $("gallery"), list = $("gallery-list"), status = $("g-status"), countEl = $("g-count");
  const form = $("gallery-tools"), q = $("g-q"), sort = $("g-sort"), clearBtn = $("g-clear"), note = $("g-note");
  const scope = $("g-scope"), scopeWrap = $("g-scope-wrap"), filterBox = $("g-filters");
  const selects = {};

  const str = v => v === null || v === undefined ? "" : String(v).trim();
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function htmlToText(v) { const t = document.createElement("template"); t.innerHTML = str(v); return t.content.textContent.replace(/\s+/g, " ").trim(); }
  function safeUrl(v) {
    let markup = str(v); if (!markup) return "";
    if (markup.startsWith("{")) { try { const o = JSON.parse(markup); markup = str(o.Url || o.url); } catch { /* not JSON */ } }
    const t = document.createElement("template"); t.innerHTML = markup;
    const a = t.content.querySelector("a[href]");
    let candidate = (a ? a.getAttribute("href") : t.content.textContent).trim();
    candidate = candidate.split(", ")[0]; /* URL columns can arrive as "url, description" */
    try { const u = new URL(candidate); return u.protocol === "https:" && !u.username && !u.password ? u.href : ""; } catch { return ""; }
  }
  function multi(v) {
    if (Array.isArray(v)) return v.map(x => str(typeof x === "string" ? x : x?.Value || x?.LookupValue || x?.Title)).filter(Boolean);
    const raw = str(v); if (!raw) return [];
    try { const p = JSON.parse(raw); if (Array.isArray(p)) return multi(p); } catch { /* plain text */ }
    return raw.replace(/^;#|;#$/g, "").split(/;#|;|\n/).map(x => x.trim()).filter(Boolean);
  }
  const people = multi; /* person fields arrive as JSON arrays of {LookupValue|Title} or as text */

  function decode(payload) {
    if (!payload || payload.format !== "rows" || typeof payload.content !== "string") throw new Error("No list data was supplied.");
    const data = JSON.parse(payload.content);
    if (!data || !Array.isArray(data.headers) || !Array.isArray(data.rows)) throw new Error("Malformed list data.");
    const col = names => { for (const n of names || []) { const i = data.headers.indexOf(n); if (i >= 0) return i; } return undefined; };
    const idx = { id: col(COLUMN_MAP.id), title: col(COLUMN_MAP.title), description: col(COLUMN_MAP.description), url: col(COLUMN_MAP.url),
      people: col(COLUMN_MAP.people), date: col(COLUMN_MAP.date), internal: col(COLUMN_MAP.internal) };
    if (idx.id === undefined || idx.title === undefined) throw new Error("Required columns (ID, Title) are missing.");
    const fIdx = COLUMN_MAP.filters.map(f => col(f.columns));
    const get = (row, i) => i === undefined ? "" : row[i];
    const items = [], seen = new Set();
    for (const row of data.rows) {
      if (!Array.isArray(row)) continue;
      const id = Number(str(get(row, idx.id))), title = htmlToText(get(row, idx.title));
      if (!Number.isSafeInteger(id) || id < 1 || seen.has(id) || !title) continue;
      seen.add(id);
      const url = safeUrl(get(row, idx.url));
      const d = new Date(str(get(row, idx.date)));
      const item = { id, title, description: htmlToText(get(row, idx.description)), url,
        people: people(get(row, idx.people)), date: Number.isFinite(d.getTime()) ? d.toISOString().slice(0, 10) : "", facets: {} };
      COLUMN_MAP.filters.forEach((f, n) => { item.facets[f.key] = f.multi ? multi(get(row, fIdx[n])) : [htmlToText(get(row, fIdx[n]))].filter(Boolean); });
      const flag = str(get(row, idx.internal)).toLowerCase();
      if (/^(yes|true|1)$/.test(flag)) item.scope = "internal";
      else if (/^(no|false|0)$/.test(flag)) item.scope = "external";
      else if (EXTERNAL_HOSTS.length && url) { const h = new URL(url).hostname; item.scope = EXTERNAL_HOSTS.some(x => h === x || h.endsWith("." + x)) ? "external" : "internal"; }
      else item.scope = "";
      items.push(item);
    }
    return items;
  }

  const fmt = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  function mark(node, text, terms) {
    if (!terms.length) { node.textContent = text; return; }
    const re = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
    node.replaceChildren(...text.split(re).map((p, i) => i % 2 ? el("mark", "", p) : document.createTextNode(p)));
  }
  function card(item, terms) {
    const li = el("li"); li.id = `item-${item.id}`;
    const art = el("article", "g-card");
    const meta = el("div", "g-meta");
    for (const f of COLUMN_MAP.filters) for (const v of item.facets[f.key]) meta.append(el("span", "pill", v));
    if (item.date) { const t = el("time", "g-date", fmt.format(new Date(`${item.date}T12:00:00Z`))); t.dateTime = item.date; meta.append(t); }
    const h3 = el("h3");
    if (item.url) { const a = el("a"); a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer"; mark(a, item.title, terms); h3.append(a); }
    else mark(h3, item.title, terms);
    art.append(meta, h3);
    if (item.description) { const p = el("p", "g-desc"); mark(p, item.description, terms); art.append(p); }
    if (item.people.length) { const p = el("p", "g-people"); mark(p, item.people.join(", "), terms); art.append(p); }
    if (item.url) { const a = el("a", "open", "Open"); a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.setAttribute("aria-label", `Open: ${item.title}`); art.append(a); }
    else art.append(el("p", "g-nolink", "No link yet."));
    li.append(art); return li;
  }

  let items = [];
  function buildFilters() {
    for (const f of COLUMN_MAP.filters) {
      const values = [...new Set(items.flatMap(i => i.facets[f.key]))].sort((a, b) => a.localeCompare(b));
      if (!values.length) continue;
      const lab = el("label", "g-filter"); lab.append(el("span", "visually-hidden", f.label));
      const s = el("select"); s.setAttribute("aria-label", f.label);
      const all = el("option", "", `All ${f.label.toLowerCase()}`); all.value = ""; s.append(all);
      for (const v of values) { const o = el("option", "", v); o.value = v; s.append(o); }
      s.addEventListener("change", apply); lab.append(s); filterBox.append(lab); selects[f.key] = s;
    }
    scopeWrap.hidden = !items.some(i => i.scope);
  }
  function readUrl() {
    let p; try { p = new URLSearchParams(window.location.search); } catch { return; }
    if (p.get("q")) q.value = p.get("q");
    for (const [k, s] of Object.entries(selects)) { const v = p.get(k); if (v && [...s.options].some(o => o.value === v)) s.value = v; }
    if (p.get("scope") === "internal") scope.checked = true;
  }
  function writeUrl() {
    try {
      const u = new URL(window.location.href);
      const set = (k, v) => v ? u.searchParams.set(k, v) : u.searchParams.delete(k);
      set("q", q.value.trim()); for (const [k, s] of Object.entries(selects)) set(k, s.value); set("scope", scope.checked ? "internal" : "");
      window.history.replaceState(null, "", u);
    } catch { /* sandboxed frames can block history updates */ }
  }
  function focusAnchor(anchor) {
    const m = /^#?item-(\d+)$/.exec(str(anchor)); if (!m) return;
    const node = $(`item-${m[1]}`); if (node) { node.scrollIntoView({ behavior: "smooth", block: "center" }); node.classList.add("g-hit"); }
  }
  function apply() {
    const terms = q.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
    const shown = items.filter(i => {
      if (scope.checked && i.scope !== "internal") return false;
      for (const [k, s] of Object.entries(selects)) if (s.value && !i.facets[k].includes(s.value)) return false;
      const hay = [i.title, i.description, i.people.join(" "), ...Object.values(i.facets).flat()].join(" ").toLocaleLowerCase();
      return terms.every(t => hay.includes(t));
    });
    shown.sort(sort.value === "title" ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (b.date || "").localeCompare(a.date || "") || b.id - a.id);
    list.replaceChildren(...shown.map(i => card(i, terms)));
    const filtered = Boolean(terms.length || scope.checked || Object.values(selects).some(s => s.value));
    clearBtn.hidden = !filtered;
    const noun = n => `${n} ${ITEM_NOUN[n === 1 ? 0 : 1]}`;
    countEl.textContent = filtered ? `Showing ${noun(shown.length)} of ${items.length}` : `Showing all ${noun(items.length)}`;
    status.hidden = shown.length > 0;
    if (!shown.length) status.textContent = filtered ? "Nothing matches. Try other words or clear the filters." : "The list has no items yet.";
    writeUrl();
  }

  function bindingSource() {
    const manifest = JSON.parse(document.querySelector("script.ka-livedata-manifest").textContent);
    const config = JSON.parse($("site-page-config").textContent);
    const expected = config && config.publicationSource;
    const src = Array.isArray(manifest) && expected ? manifest.find(m => m && m.spItemUrl === expected.spItemUrl) : null;
    if (!src || ["kind", "spItemUrl", "webUrl", "listId", "label"].some(k => src[k] !== expected[k])) throw new Error("The list binding is invalid: manifest and page config disagree.");
    return src;
  }

  function start() {
    try {
      const src = bindingSource();
      const live = window.__LD_RESULTS__ && window.__LD_RESULTS__[src.spItemUrl];
      if (live) items = decode(live);
      else {
        const snap = JSON.parse(($("snapshot-data") || {}).textContent || "null");
        if (!snap || !snap.payload) throw new Error("Live list data is not available on this page.");
        items = decode(snap.payload);
        note.hidden = false; note.textContent = `Showing a saved copy of the list from ${snap.savedOn || "an earlier date"}.`;
      }
      buildFilters(); readUrl();
      section.dataset.state = "ready"; list.setAttribute("aria-busy", "false");
      apply(); focusAnchor(window.location.hash);
      q.addEventListener("input", (() => { let t; return () => { clearTimeout(t); t = setTimeout(apply, 120); }; })());
      scope.addEventListener("change", apply); sort.addEventListener("change", apply);
      form.addEventListener("submit", e => { e.preventDefault(); apply(); });
      clearBtn.addEventListener("click", () => { q.value = ""; scope.checked = false; for (const s of Object.values(selects)) s.value = ""; apply(); q.focus(); });
      window.addEventListener("hashchange", () => focusAnchor(window.location.hash));
      window.addEventListener("message", e => { const d = e.data; focusAnchor(typeof d === "string" ? d : d && (d.anchor || d.hash || d.id)); });
    } catch (err) {
      section.dataset.state = "unavailable"; list.setAttribute("aria-busy", "false"); form.hidden = true;
      status.hidden = false; status.textContent = "This list couldn't be loaded. Reload the page, or open the list in SharePoint.";
      console.error("[site-kit gallery]", err);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true }); else start();
})();
</script>
<script>
(() => {
  const b = document.getElementById("theme-toggle");
  const sync = () => { const dark = document.documentElement.dataset.theme === "dark"; b.setAttribute("aria-pressed", String(dark)); b.textContent = dark ? "Light mode" : "Dark mode"; };
  sync();
  b.addEventListener("click", () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; sync(); });
})();
</script>

<!-- link-allowlist:start (static copies of list links so the SharePoint viewer lets them open; regenerate with scripts/allowlist_from_list.py when list items change) -->
<nav id="link-allowlist" hidden aria-hidden="true" style="display:none">
</nav>
<!-- link-allowlist:end -->

<script id="link-helper">
(() => {
  /* Links built from list data that are not in the allowlist: try window.open, else show a copy popover. */
  const DYNAMIC = "#gallery-list";
  let pop = null;
  const close = () => { if (pop) { pop.remove(); pop = null; } };
  const allowed = url => [...document.querySelectorAll("#link-allowlist a[href]")].some(a => a.href === url);
  function show(url) {
    close();
    pop = document.createElement("div"); pop.className = "lh-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-modal", "true"); pop.setAttribute("aria-labelledby", "lh-title");
    pop.innerHTML = '<h2 id="lh-title">Open this link in a new tab</h2><p>The SharePoint page viewer blocked this link. Copy it and paste it into a new browser tab, or right-click the link and choose "Open link in new tab".</p><div class="lh-row"><input type="text" readonly aria-label="Link address"><button type="button" class="lh-copy">Copy link</button></div><p class="lh-done" aria-live="polite"></p><button type="button" class="lh-close">Close</button>';
    const input = pop.querySelector("input"), done = pop.querySelector(".lh-done"); input.value = url;
    pop.querySelector(".lh-copy").addEventListener("click", () => { input.select(); try { navigator.clipboard.writeText(url).then(() => { done.textContent = "Link copied."; }, () => { done.textContent = "Press Ctrl+C to copy."; }); } catch { done.textContent = "Press Ctrl+C to copy."; } });
    pop.querySelector(".lh-close").addEventListener("click", close);
    document.body.append(pop); pop.querySelector(".lh-copy").focus();
  }
  document.addEventListener("click", e => {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || !a.closest(DYNAMIC) || !/^https?:/i.test(a.href) || allowed(a.href)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    let w = null; try { w = window.open(a.href, "_blank", "noopener"); } catch { w = null; }
    if (!w) show(a.href);
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
})();
</script>
