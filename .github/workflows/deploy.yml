name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh baked-in skill ratings (positive reaction counts) once a day even
  # when there are no code pushes, so "Top rated" sort stays current. The build
  # and deploy only run when the counts actually changed, so quiet days don't
  # produce a redundant no-op deployment (see the "Fetch skill ratings" step).
  schedule:
    - cron: "0 6 * * *"

permissions:
  actions: read
  contents: write # commit the refreshed ratings snapshot back to main
  pages: write
  id-token: write
  discussions: read

# Allow one concurrent deployment, skipping runs queued between in-progress and latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.ratings.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch skill ratings
        id: ratings
        run: |
          npm run ratings:fetch
          if git diff --quiet -- src/data/ratings.json; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Always build/deploy on code pushes and manual runs; on the daily
          # cron, only when the reaction counts actually changed.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$changed" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No rating changes on scheduled run; skipping build and deploy."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist refreshed ratings
        if: steps.ratings.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ratings.json
          git commit -m "chore(ratings): refresh skill reaction counts"
          # A GITHUB_TOKEN push does not retrigger workflows, so this run still
          # owns the deploy below; the commit only keeps tomorrow's diff stable.
          git push || echo "::warning::Could not push refreshed ratings; will retry next run."
      # Regenerate every skill page + bundle from submissions/ before building.
      # PR CI only commits generated content back to SAME-REPO PR branches; fork
      # PRs are validate-only, so their src/content/skills/<slug>.md never lands
      # on main and the skill would 404 / be missing from the gallery. Importing
      # here makes the deployed site reflect submissions/ regardless of how a PR
      # was merged. Idempotent: it rewrites the same files a same-repo PR did.
      - name: Import skill submissions
        if: steps.ratings.outputs.should_deploy == 'true'
        run: npm run import:submissions
      - name: Build
        if: steps.ratings.outputs.should_deploy == 'true'
        run: npm run build
      - name: Upload Pages artifact
        if: steps.ratings.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | if length == 1 then .[0].id else empty end'
          )"
          if [ -z "$artifact_id" ]; then
            echo "::error::Expected exactly one github-pages artifact for this workflow attempt."
            exit 1
          fi

          oidc_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}" |
              jq --raw-output '.value // empty'
          )"
          if [ -z "$oidc_token" ]; then
            echo "::error::GitHub Actions did not issue a Pages OIDC token."
            exit 1
          fi
          echo "::add-mask::$oidc_token"

          deployment="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments" \
              -F artifact_id="$artifact_id" \
              -f pages_build_version="$GITHUB_SHA" \
              -f oidc_token="$oidc_token"
          )"
          page_url="$(jq --raw-output '.page_url // empty' <<< "$deployment")"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"

          for attempt in {1..240}; do
            if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}" --jq '.status')"; then
              echo "::warning::Could not read Pages deployment status (attempt ${attempt}/240)."
              sleep 5
              continue
            fi

            case "$status" in
              succeed)
                echo "Pages deployment succeeded."
                exit 0
                ;;
              deployment_queued|deployment_in_progress|deployment_attempt_error|unknown_status|not_found)
                echo "Pages deployment status: $status (attempt ${attempt}/240)"
                sleep 5
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment ended with status: $status"
                exit 1
                ;;
              *)
                echo "::error::Pages deployment returned unexpected status: $status"
                exit 1
                ;;
            esac
          done

          echo "::error::Pages deployment did not succeed within 20 minutes."
          exit 1
